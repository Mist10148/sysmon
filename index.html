<!--
  Theme, before the first paint.

  If this ran with the rest of the scripts at the end of the body the page would
  paint light and then flip, which is the one thing a dark-mode user notices. So
  it is inline, in the head, and deliberately duplicates the small amount of
  logic that also lives in js/shell/theme.js.
-->
<script>
(function () {
  try {
    var saved = localStorage.getItem('sysmon-theme') || 'system';
    var dark = saved === 'dark' ||
      (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.documentElement.classList.add('dark');
  } catch (e) {
    /* Private mode can throw on localStorage. Light is a fine answer. */
  }
})();
</script>

<!--
  The script list IS the dependency graph.

  These are classic scripts, not modules, and that is a deliberate choice:
  <script type="module"> is CORS-blocked on file://, so modules would mean
  SysMon could only be opened through a web server. Ordered classic scripts
  work by double-clicking index.html and work on GitHub Pages, with no build
  step in either case. Everything hangs off one global, window.SM.
-->
